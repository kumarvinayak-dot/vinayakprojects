<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Step 15 — Environment Validation</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #f8fafc; margin: 0; padding: 20px; color: #0f172a; }
    .card { max-width: 980px; margin: 0 auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 18px; }
    h1 { margin-top: 0; font-size: 20px; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    .btn { margin-top: 14px; background: #7c3aed; color: #fff; border: 0; padding: 12px 16px; border-radius: 8px; font-weight: 700; }
    .hint { color: #64748b; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Step 15: Environment Validation (optional SSH check)</h1>
    <p class="hint">Enable <strong>Environment Validation</strong> on the home page while comparison runs in another tab.</p>
    <div class="grid">
      <div><label>Host / IP</label><input value="10.x.x.x" readonly /></div>
      <div><label>Username</label><input value="ssh_user" readonly /></div>
      <div><label>Password</label><input value="********" readonly /></div>
      <div><label>Port</label><input value="22" readonly /></div>
    </div>
    <label>Remote environment path</label>
    <input value="/opt/app/deploy" readonly />
    <label>JAR name(s) to search</label>
    <input value="AmdocsSecurityManager.jar" readonly />
    <button class="btn">Search environment &amp; validate JAR manifest</button>
  </div>
</body>
</html>
