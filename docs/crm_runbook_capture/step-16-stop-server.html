<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Step 16 — Stop Server</title>
  <style>
    body { font-family: Segoe UI, system-ui, sans-serif; margin: 0; background: #1e293b; padding: 24px; }
    .desktop { background: #334155; border-radius: 12px; padding: 24px; max-width: 880px; margin: 0 auto; min-height: 320px; }
    h1 { color: #f8fafc; font-size: 18px; margin: 0 0 16px; }
    .icons { display: flex; flex-wrap: wrap; gap: 16px; }
    .icon { width: 120px; text-align: center; color: #e2e8f0; font-size: 11px; }
    .icon-box { background: #475569; border: 2px solid #94a3b8; border-radius: 8px; padding: 14px 8px; margin-bottom: 6px; font-size: 28px; }
    .icon.hl .icon-box { border-color: #f87171; background: #7f1d1d; box-shadow: 0 0 0 3px rgba(248,113,113,.4); }
    .hint { color: #94a3b8; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="desktop">
    <h1>Step 16: Stop the server when verification is complete</h1>
    <div class="icons">
      <div class="icon"><div class="icon-box">▶</div>ASCF Compare Tool - Start</div>
      <div class="icon hl"><div class="icon-box">⏹</div><strong>Stop Server</strong><br />(Start Menu)</div>
      <div class="icon hl"><div class="icon-box">📄</div>STOP_SERVER.bat</div>
    </div>
    <p class="hint">Double-click <strong>Stop Server</strong> from Start Menu → ASCF Compare Tool, or run STOP_SERVER.bat in the install folder.</p>
  </div>
</body>
</html>
