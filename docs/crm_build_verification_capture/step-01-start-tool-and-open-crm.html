<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Step 1 — Start tool and open /crm</title>
  <style>
    body { font-family: Segoe UI, system-ui, sans-serif; margin: 0; background: #f1f5f9; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 980px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 18px; }
    h3 { margin: 0 0 12px; color: #0369a1; }
    .step { color: #0369a1; font-weight: 700; margin-bottom: 8px; }
    .shortcut { display: flex; align-items: center; gap: 12px; padding: 14px; background: #eff6ff; border: 1px dashed #93c5fd; border-radius: 10px; }
    .icon { width: 48px; height: 48px; background: #2563eb; border-radius: 10px; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .browser { border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; }
    .bar { background: #e2e8f0; padding: 8px 12px; font-size: 12px; font-family: Consolas, monospace; }
    .page { padding: 16px; background: linear-gradient(135deg,#1e3a8a,#2563eb); color: #fff; font-size: 14px; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="step">Step 1a</div>
      <h3>Start the comparison tool</h3>
      <div class="shortcut">
        <div class="icon">▶</div>
        <div>
          <strong>ASCF Compare Tool - Start</strong><br />
          <span style="font-size:13px;color:#64748b;">Desktop shortcut — or run <code>start_server.bat</code></span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="step">Step 1b</div>
      <h3>Open the CRM page</h3>
      <div class="browser">
        <div class="bar">http://localhost:5000/crm</div>
        <div class="page">Build comparison — ASCF / CRM / UXF/OMNI</div>
      </div>
      <p style="font-size:13px;color:#64748b;margin:12px 0 0;">Use Chrome or Edge on the same PC where the tool is installed.</p>
    </div>
  </div>
</body>
</html>
